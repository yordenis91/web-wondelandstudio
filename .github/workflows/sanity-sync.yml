name: Sanity sync

# Trae de vuelta al sitio lo que Lisandra edite en Sanity Studio (NAP y testimonios —
# ver docs/SANITY_MIGRATION.md §7). Corre sola cada 6 horas; "Run workflow" en la
# pestaña Actions la dispara al instante si no se quiere esperar al cron.
#
# `sanity:sync:apply` solo escribe si el dato de Sanity difiere de lo que ya hay en el
# repo, así que un run sin cambios termina sin commit — no ensucia el historial.
# Antes de empujar nada se valida con el mismo `pnpm build` + `pnpm test` que corre en
# local (check-tokens, hreflang, presupuesto de rendimiento): si el sync deja el sitio
# roto, el job falla y no se hace push — nunca llega un dato malo a main.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: sanity-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Traer datos de Sanity
        env:
          # Project ID y dataset públicos de lectura, no son secretos — mismos valores
          # que studio/.env (gitignored solo porque es config local, no por ser sensible).
          SANITY_STUDIO_PROJECT_ID: 74tin3nw
          SANITY_STUDIO_DATASET: production
        run: pnpm run sanity:sync:apply

      - name: Validar que el sitio sigue construyendo bien
        run: |
          pnpm build
          pnpm test

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/business.ts src/content/testimonials.ts
          if git diff --cached --quiet; then
            echo "Sin cambios de Sanity — nada que commitear."
            exit 0
          fi
          git commit -m "sync: datos desde Sanity ($(date -u +%Y-%m-%d))"
          git push
